# Local services for development. Production uses Azure Database for PostgreSQL
# and Azure Cache for Redis (Redis is used from Phase 2 onward).
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: vo_dev
    ports: ["5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres-init.sql:/docker-entrypoint-initdb.d/init.sql:ro  # also creates vo_test
  redis:
    image: redis:7
    ports: ["6379:6379"]
volumes:
  pgdata:
